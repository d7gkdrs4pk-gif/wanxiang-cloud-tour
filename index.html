const SHORT={"station":"这里是京阪电车祇园四条站，出口位于鸭川东侧。步行不远就能看到四条大桥和南座剧场。先从站牌辨认方向，看看周围的街口，再进入这段京都漫游。","minamiza":"南座坐落在四条大桥东侧，是与京都歌舞伎演出传统有关的剧场。看看照片里的屋檐、招牌与入口装饰，繁忙的街道中保留着鲜明的传统建筑气息。","riverSpring":"这是从四条大桥望向鸭川上游的实拍视角。河水穿过京都市区，两岸有步道、建筑与树木，远处桥梁依次排开。顺着河面的方向，把视线慢慢放远。","riverSummer":"换到夏季的四条大桥附近，河岸建筑、步道与水面呈现另一种层次。与春日河景对照，你会发现同一个地点的季节变化。两张照片来自不同年份。","yuka":"鸭川西岸的“纳凉床”，是临河餐厅夏季搭设的露天用餐平台。人们在河边用餐、感受凉风，这是京都有代表性的季节风物。留意木平台如何向河岸延伸。","oldStreet":"先斗町是一条与鸭川大致平行的狭窄街巷，沿街分布着餐饮店铺。照片里的木格栅、门廊与小灯，让道路显得更有纵深。这是过去某年的真实街景。","alleyRed":"走进先斗町的餐厅街区，灯笼和门前光线把视线引向巷子深处。不同于宽阔的河岸，这里适合慢慢观察店面和街道细节。照片记录的是当年的真实一瞬。","lantern":"这是一张先斗町纸灯笼的近景。没有宽广的城市全景，反而更容易注意灯笼表面的字样、材质与光影。旅行记忆，有时就来自这样一件小小的街巷物件。","kaiseki":"先斗町的窄巷两侧有不少临街餐厅，门廊、木质立面与招牌是画面重点。照片来自过去的一个夜晚，可以观察空间与灯光，但不能据此判断店铺如今是否营业。","streetLights":"入夜后的先斗町，灯笼与街灯照亮狭窄的道路。画面中的行人只是恰好经过的陌生人，街巷因此显得真实而有生活感。看看灯光怎样沿着道路逐渐延伸。","streetBw":"这是一张独立拍摄的先斗町黑白照片，并非网页为彩色图添加滤镜。没有色彩干扰，街道线条、行人轮廓与亮暗反差更加突出。试着一路看到巷子尽头。","riverNight":"再回到鸭川，临河建筑的灯火、步道与水面呈现出不同于白天的氛围。夜景来自另一拍摄日期，不是此前河岸照片的同日晚间。把它当作一次跨时间的观景。","shijoPortrait":"从四条大桥附近向鸭川下游望去，两岸的步道与临河木平台逐渐延伸。照片拍于2024年8月，试着把这里的河岸层次与另一侧的桥上视角作比较。","riversideEvening":"仍在四条大桥附近，却转向上游。左侧木平台、右侧树木与远方山影，让这张河景有了不同的层次。这与另一张桥上照片相隔几分钟，属于同日不同方向。","sanjoEast":"三条大桥位于四条大桥北侧，连接鸭川两岸的城市街道。来到桥东一带，视线从水面转向街口，这里不仅是观景位置，也是人们日常通行的城市节点。","sanjoBridge":"这是三条大桥东端的桥头实拍。与远远望见桥梁不同，站到桥边更容易辨认道路、桥身与周边街景的尺度。三条大桥与四条大桥是两个不同的真实地点。","alleyPortrait":"换成竖幅照片看先斗町，狭窄的道路更接近手机上的步行视角。木质立面与路旁灯光向画面深处延伸。拍摄地点确认为先斗町街区，但精确门牌未核实。","pontochoSouth":"从四条一侧走近先斗町南段，窄巷、门廊与灯光构成不同于河岸的体验。这张较早年份的实拍适合观察街道的空间尺度，不代表今天的店铺外观仍然相同。","pontochoNorth":"先斗町向北延伸至三条一带。这张旧时实拍记录了北段的店面、灯笼与狭长道路。看看它与南段街景的差异，但不要把不同年份的影像当作同一天的连续游览。","restaurantFront":"先斗町的看点不只有整条街的灯火。靠近一处餐厅门面，可以看到木质立面、招牌与门口灯笼的组合。照片记录的是过去的真实外观，当前经营状态尚未核实。"};

 // Migration for unfinished P0.7 journeys: keep visited spots, append only unseen spots.
 const visited=[...new Set((Array.isArray(state.visited)?state.visited:[]).filter(id=>!!SCENES[id]))];
 if(!visited.includes('station'))visited.unshift('station');
 if(visited[visited.length-1]!==state.at){const at=visited.indexOf(state.at);if(at>=0)visited.splice(at,1);visited.push(state.at)}
 const oldStreet=visited.indexOf('oldStreet'),oldRiver=visited.indexOf('riverSpring');
 const mode=(oldStreet>=0&&(oldRiver<0||oldStreet<oldRiver))?'alley':'river';
 state.tourOrder=[...visited,...FULL_TOURS[mode].filter(id=>!visited.includes(id))];
 state.routeTheme=mode;
 save();
 return state.tourOrder;
}
function nextTourStop(){const order=ensureTourOrder();if(!order)return null;const at=order.indexOf(state.at);return at>=0&&at<order.length-1?order[at+1]:'end'}
function begin(){bgmStart();trialStart();state.pauseChoices={};state.at='station';state.visited=[];state.insights=[];state.stamps=[];state.memories=[];state.history=[];state.detail=false;state.tourOrder=[];state.routeTheme=null;save();render()}
function renderScene(){
 const k=state.at,s=SCENES[k],a=MEDIA[k];
 if(!s||!a){state.at='welcome';render();return}
 if(!state.visited.includes(k))state.visited.push(k);
 const order=ensureTourOrder(),at=order?order.indexOf(k):0,old=state.visited.length,next=order&&at>=0?(at+1<order.length?order[at+1]:'end'):null;
 save();
 const routeChoice=!order&&k==='station';
 const controls=routeChoice?
 `<button class="btn gold" onclick="choose(0)" onpointerenter="preloadNext('riverSpring')" onfocus="preloadNext('riverSpring')"><span>先沿鸭川看风景 · 完整20站</span><span class="arr">→</span></button><button class="btn" onclick="choose(1)" onpointerenter="preloadNext('minamiza')" onfocus="preloadNext('minamiza')"><span>先走进先斗町 · 完整20站</span><span class="arr">→</span></button>` :
 `<button class="btn gold" onclick="choose(0)" ${next&&next!=='end'?`onpointerenter="preloadNext('${next}')" onfocus="preloadNext('${next}')" ontouchstart="preloadNext('${next}')"`:''}><span>${next==='end'?'已看遍20景 · 领取旅行明信片':'继续下一站 · '+esc(MEDIA[next]?.name||'京都')}</span><span class="arr">→</span></button><button class="btn secondary" onclick="showInfo()"><span>停一停，了解这一站</span><span class="arr">ⓘ</span></button>`;
 const label=routeChoice?'两条路线均包含全部20处实景':(state.routeTheme==='alley'?'街巷优先 · 20景完整漫游':'鸭川优先 · 20景完整漫游');
 app.innerHTML=`<main class="frame immersive">${photoBox(a)}${topBar(true)}<div class="progress"><b style="width:${Math.min(100,Math.round(old/SCENE_IDS.length*100))}%"></b></div><section class="content"><div class="scene-index"><div class="eyebrow">${String(at+1).padStart(2,'0')} / ${SCENE_IDS.length} · ${esc(label)}</div><div class="muted">${old}/${SCENE_IDS.length} 已探索</div></div><h1 class="h1">${esc(a.name)}</h1><p class="lead">${esc(SHORT[k]||s.location)}</p>${pauseButton(k)}<div class="choices">${controls}</div><div class="bottomnav"><button class="smallbtn" onclick="back()">← 上一站</button><button class="smallbtn" onclick="gallery()">全部影像</button></div></section></main>`;
}
function toggleDetail(){state.detail=!state.detail;save();render()}
function choose(n){
 if(!SCENES[state.at])return;
 const isRouteChoice=state.at==='station'&&!validTourOrder(state.tourOrder);
 if(isRouteChoice&&n!==0&&n!==1)return;
 if(!isRouteChoice&&n!==0)return;
 const order=isRouteChoice?FULL_TOURS[n===0?'river':'alley']:ensureTourOrder();
 if(!validTourOrder(order))return;
 const here=order.indexOf(state.at),next=here>=0&&here<order.length-1?order[here+1]:'end';
 if(here<0)return;
 // Do not allow a completed journey unless all 20 unique scenes were seen.
 if(next==='end'&&new Set(state.visited).size!==SCENE_IDS.length)return;
 state.history.push(JSON.stringify({at:state.at,visited:[...state.visited],insights:[...(state.insights||[])],stamps:[...state.stamps],memories:[...state.memories],detail:state.detail,tourOrder:[...(state.tourOrder||[])],routeTheme:state.routeTheme||null}));
 if(state.history.length>SCENE_IDS.length)state.history.shift();
 if(isRouteChoice){state.tourOrder=[...order];state.routeTheme=n===0?'river':'alley';}
 const scene=SCENES[state.at];
 if(!state.stamps.includes(scene.stamp))state.stamps.push(scene.stamp);
 if(next!=='end'&&SCENES[next]?.stamp&&!state.stamps.includes(SCENES[next].stamp))state.stamps.push(SCENES[next].stamp);
 state.memories.push(`${scene.subtitle}：${next==='end'?'完成全部20处实景':`继续看${MEDIA[next]?.name||'京都'}`}`);
 if(state.memories.length>13)state.memories.shift();
 trialSync();state.at=next;state.detail=false;save();render();window.scrollTo(0,0);
}
function back(){
 const prev=state.history.pop();
 if(!prev){state.at='welcome';state.detail=false;state.tourOrder=[];state.routeTheme=null}
 else {const s=JSON.parse(prev);state.at=s.at;state.visited=s.visited;state.insights=s.insights||[];state.stamps=s.stamps;state.memories=s.memories;state.detail=s.detail;state.tourOrder=validTourOrder(s.tourOrder)?s.tourOrder:[];state.routeTheme=s.routeTheme||null;}
 save();render();
}
function renderEnd(){
 const rec=recordNow(),n=recVisited(rec).length,info=recInsights(rec).length,earned=awards(rec);
 const key=featuredScene(rec),name=MEDIA[key]?.name||'鸭川',line=postcardLine(rec),title=recordTitle(rec);
 const friend=validRecord(state.friendJourney);
 app.innerHTML=`<main class="frame immersive">${photoBox(MEDIA.riverNight)}${topBar()}<section class="content"><div class="eyebrow">京都 · 我的云旅行纪念</div><div class="journal"><div class="rewardBadge">✦ ${esc(title)}</div><h2>${esc(rec.n)}，<br>你收藏了一段京都时光。</h2><p class="lead" style="margin-bottom:7px">真实的风景，不必匆忙看完。</p><div class="memorySpot"><strong>你可以分享的这一站：${esc(name)}</strong><span>${esc(line)}</span></div><p class="muted">${n===SCENE_IDS.length?'完整收藏了京都20处实景。':'这次你看过'+n+'处实景。'}深入了解${info}个地点。<br>走过的地方：${esc(pathSummary(rec,5))}</p><div class="achievementGrid">${earned.length?earned.slice(0,3).map(a=>`<span class="achievement">✦ ${esc(a.title)}</span>`).join(''):'<span class="muted">下一次可以换条路线，再发现不同的风景。</span>'}</div>${friend?`<p class="friendNote">从${esc(normalNickname(friend.n))}分享的一张风景开始，你也走出了一段属于自己的旅程。</p>`:''}${pauseSummary()}<div class="rewardFoot">实景互动云旅行，非真实到访证明；照片来自不同时期。</div></div><div class="choices"><button class="btn gold" onclick="openPoster()">制作我的京都旅行明信片 <span class="arr">▧</span></button></div><div class="sharePanel"><button class="btn secondary" onclick="shareLink()">分享给朋友看看 <span class="arr">↗</span></button><button class="btn secondary" onclick="copyLink()">复制旅行邀请链接 <span class="arr">⧉</span></button></div><div class="sharePanel"><button class="btn secondary" onclick="review()">回看照片 <span class="arr">→</span></button><button class="btn secondary" onclick="restart()">再走一条路线 <span class="arr">↻</span></button></div>${trialMode?trialPanel():''}</section></main>`
}

function review(){gallery(true)}
function gallery(visitedOnly=false){const keys=visitedOnly?state.visited:Object.keys(MEDIA);const items=keys.map(k=>MEDIA[k]).filter(Boolean);app.innerHTML=`<main class="frame library"><div class="libraryhead"><div class="eyebrow">京都 · 旅行相册</div><button class="round" onclick="render()">返回旅程</button></div><h2>${visitedOnly?'走过的地方':'全部实景'}</h2><div class="librarygrid">${items.map(a=>`<div class="libraryitem"><img src="${a.src}" alt="${esc(a.name)}" loading="lazy" referrerpolicy="no-referrer"><div>${esc(a.name)}</div></div>`).join('')}</div><button class="smallbtn" onclick="help()" style="margin-top:22px">关于这趟旅行</button></main>`}
function help(){const entries=Object.values(MEDIA).map(a=>`<div>${esc(a.name)} · ${esc(a.author)} · ${esc(a.license)} · <a href="${a.page}" target="_blank" rel="noopener">来源与许可</a></div>`).join('');const z=document.createElement('div');z.className='overlay';z.innerHTML=`<button class="overlayClose">✕ 关闭</button><div class="credits"><h2 style="margin-top:0">关于这趟旅行</h2><p>这是一份京都实景互动内测作品，画面摄于不同时间，并非同一天的连续录像。</p><p>打开地点、选择方向，就能按自己的节奏浏览。</p><details><summary>照片署名与许可信息</summary>${entries}</details></div>`;z.querySelector('button').onclick=()=>z.remove();document.body.appendChild(z)}
function restart(){if(confirm('确定要重新开始吗？这会清空当前路线与收集印记。')){state={at:'welcome',mood:state.mood,nickname:state.nickname||'',visited:[],insights:[],stamps:[],memories:[],history:[],detail:false,friendJourney:null,tourOrder:[],routeTheme:null,pauseChoices:{}};save();render()}}
function downloadCard(){openPoster()}
function travelTitle(){return recordTitle(recordNow())}
function shortPath(){let names=state.visited.map(k=>MEDIA[k]?.name).filter(Boolean);return names.length?names.slice(0,5):['祇园四条站','鸭川']}
function toast(message){document.querySelectorAll('.toast').forEach(x=>x.remove());const x=document.createElement('div');x.className='toast';x.textContent=message;document.body.appendChild(x);setTimeout(()=>x.remove(),3200)}
function shareText(){const rec=recordNow(),key=featuredScene(rec),name=MEDIA[key]?.name||'鸭川';return `刚在《京都的一次慢旅行》里看到「${name}」这处实景：${postcardLine(rec)} 我觉得挺有意思，你也点开看看京都吧。`}

async function copyLink(){const url=shareUrl();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url)}else{const x=document.createElement('textarea');x.value=url;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();if(!ok)throw Error('copy blocked')}toast('旅行邀请链接已复制，可以发送给朋友')}catch(e){const x=document.getElementById('shareAddress');if(x){x.value=url;x.focus();x.select()}toast('复制受限，请长按旅行邀请链接复制')}}
async function shareLink(){const url=shareUrl();if(navigator.share){try{await navigator.share({title:'想让你看看京都的一处真实风景｜万象人生',text:shareText(),url});return}catch(e){if(e?.name==='AbortError')return}}await copyLink()}
function loadCanvasPhoto(url){return new Promise(resolve=>{let done=false;const im=new Image();const finish=v=>{if(!done){done=true;resolve(v)}};im.crossOrigin='anonymous';im.referrerPolicy='no-referrer';im.onload=()=>finish(im);im.onerror=()=>finish(null);im.src=url;setTimeout(()=>finish(null),4500)})}
function textWrap(ctx,str,x,y,width,lineH,maxLines){let line='',count=0;for(const ch of str){if(ctx.measureText(line+ch).width>width && line){ctx.fillText(line,x,y+count*lineH);count++;if(count>=maxLines)return;line=ch}else{line+=ch}}if(line && count<maxLines)ctx.fillText(line,x,y+count*lineH)}

function drawJourneyQR(ctx,url,x,y,size){const qr=new QRCode(0,0);qr.addData(url);qr.make();const n=qr.getModuleCount(),cell=Math.floor(size/(n+8)),outer=(n+8)*cell,left=x+Math.floor((size-outer)/2),top=y+Math.floor((size-outer)/2);if(cell<2)throw Error('QR link exceeds poster capacity');ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);ctx.fillStyle='#08191b';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect(left+(c+4)*cell,top+(r+4)*cell,cell,cell);return true}
async function makePoster(){
 const c=document.createElement('canvas');c.width=1080;c.height=1920;
 const x=c.getContext('2d'),rec=recordNow(),key=featuredScene(rec),a=MEDIA[key]||MEDIA.riverSpring,url=shareUrl();
 const bg=x.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#244043');bg.addColorStop(1,'#081a1c');x.fillStyle=bg;x.fillRect(0,0,1080,1920);
 const posterHQ=photoQualityUrl(a,'scene');
 const photo=(posterHQ!==a.src?await loadCanvasPhoto(posterHQ):null)||await loadCanvasPhoto(a.src);
 if(photo){const scale=Math.max(1080/photo.width,1450/photo.height),sw=1080/scale,sh=1450/scale,sx=(photo.width-sw)/2,sy=(photo.height-sh)/2;x.drawImage(photo,sx,sy,sw,sh,0,0,1080,1450)}
 else{const g=x.createLinearGradient(0,0,1080,1450);g.addColorStop(0,'#3b6565');g.addColorStop(1,'#10262a');x.fillStyle=g;x.fillRect(0,0,1080,1450)}
 const v=x.createLinearGradient(0,120,0,1535);v.addColorStop(0,'rgba(5,18,19,.27)');v.addColorStop(.39,'rgba(8,22,23,.02)');v.addColorStop(.67,'rgba(8,22,23,.45)');v.addColorStop(1,'#0b1d20');x.fillStyle=v;x.fillRect(0,0,1080,1600);
 x.fillStyle='#f1d59c';x.font='600 33px sans-serif';x.fillText('万象人生  /  KYOTO',76,126);
 x.fillStyle='#fffaf0';x.font='bold 84px serif';x.fillText('原来京都，',76,1015);x.fillText('还有这样的风景。',76,1118);
 x.fillStyle='#f3dab0';x.font='bold 39px sans-serif';textWrap(x,a.name,78,1210,908,48,2);
 x.fillStyle='#edf4ef';x.font='33px sans-serif';textWrap(x,postcardLine(rec),78,1308,910,49,2);
 x.fillStyle='#e9d5a7';x.font='30px sans-serif';textWrap(x,`来自 ${rec.n} 的云旅行明信片`,78,1437,840,44,2);
 x.fillStyle='rgba(225,235,232,.62)';x.fillRect(76,1514,928,1);
 x.fillStyle='#fffaf0';x.font='bold 37px sans-serif';x.fillText('想看看这样的京都吗？',78,1607);
 x.fillStyle='#d2e1dc';x.font='30px sans-serif';x.fillText('扫码进入真实照片漫游',78,1670);
 drawJourneyQR(x,url,761,1516,269);
 x.fillStyle='#e8d49f';x.font='25px sans-serif';x.fillText('扫码去看看',817,1820);
 x.fillStyle='#adbfba';x.font='22px sans-serif';x.fillText('不同时期的实景摄影 · 云端体验，非实际到访证明',76,1863);
 c.dataset.photoReady=photo?'1':'0';
 return c
}

async function openPoster(){
 const url=shareUrl(),z=document.createElement('div');z.className='overlay posterOverlay';
 z.innerHTML=`<div class="posterHead"><strong>我的京都旅行明信片 · P0.5.1</strong><button class="overlayClose" type="button">✕ 关闭</button></div><p class="posterHelp" id="posterStatus">正在生成旅行明信片和风景邀请二维码…</p><div class="posterActions"><button class="btn" type="button" onclick="savePoster()">保存图片</button><button class="btn" type="button" onclick="sharePoster()">分享明信片</button></div><button class="btn secondary" type="button" onclick="shareLink()" style="max-width:430px;justify-content:center">直接分享这处风景</button><input class="posterLink" id="shareAddress" readonly aria-label="我的京都旅行邀请网址" value="${esc(url)}">`;
 z.querySelector('.overlayClose').onclick=()=>z.remove();document.body.appendChild(z);posterFile=null;posterData=null;
 try{
  const c=await makePoster();if(!z.isConnected)return;posterData=c.toDataURL('image/png');
  const im=document.createElement('img');im.className='posterImage';im.alt='京都实景云旅行明信片';im.src=posterData;im.title='手机可长按此图储存到照片';z.querySelector('.posterHead').after(im);
  z.querySelector('#posterStatus').textContent=c.dataset.photoReady==='1'?'朋友扫码后会先看到你喜欢的京都风景，再决定是否开始自己的云旅行。':'当前浏览器未允许将远程实景照片写入明信片。建议直接分享旅行链接，让朋友在网页中看真实照片。';
  c.toBlob(blob=>{if(blob){posterFile=new File([blob],'京都慢旅行_实景旅行明信片.png',{type:'image/png'})}},'image/png')
 }catch(e){z.querySelector('#posterStatus').textContent='明信片暂未生成，可以直接分享旅行邀请链接';toast('明信片生成失败，请稍后重试')}
}

function savePoster(){if(!posterData){toast('海报还没有生成');return}const a=document.createElement('a');a.href=posterData;a.download='京都慢旅行_我的云游纪念.png';document.body.appendChild(a);a.click();a.remove();toast('如未保存，请长按海报图片，选择“储存到照片”')}
async function sharePoster(){if(posterFile&&navigator.share&&navigator.canShare?.({files:[posterFile]})){try{await navigator.share({files:[posterFile],title:'京都的一次慢旅行｜想让你看看这里',text:shareText()});return}catch(e){if(e?.name==='AbortError')return}}toast('请长按明信片保存到相册，再从微信朋友圈选择照片发布')}

render();
</script></body></html>
