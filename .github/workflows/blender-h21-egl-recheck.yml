name: H21 Blender EGL one-time acceptance retest
on:
  push:
    paths:
      - '.github/workflows/blender-h21-egl-recheck.yml'
permissions:
  contents: write
concurrency:
  group: fengming-h21-egl-recheck
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender and missing EGL runtime
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender libegl1
          ldconfig -p | grep -F 'libEGL.so.1'
          blender --version | head -n 2
      - name: Generate diagnostic model, GLB and four PNG angles
        run: blender -b -t 2 --python .github/scripts/blender_environment_smoke.py
      - name: Independently validate all required diagnostic outputs
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          p=pathlib.Path('fengming-v2-scene-a/diagnostics/blender-smoke')
          r=json.loads((p/'toolchain-qa.json').read_text())
          assert r['status']=='PASS' and r['headless'] and r['geometry_nodes_api']
          assert r['tripo_credits_spent']==0 and r['gltf_mesh_count']>=2
          for k in ('front','right','back','top'):
              raw=(p/(k+'.png')).read_bytes()
              assert raw[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',raw[16:24])==(420,420)
          raw=(p/'blender-environment-smoke.glb').read_bytes()
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          assert (p/'blender-environment-smoke.blend').stat().st_size>1024
          print('H21 RETEST PASS: diagnostic blend/GLB/four PNGs validated')
          PY
      - name: Preserve diagnostics if created
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengming-h21-egl-recheck
          path: fengming-v2-scene-a/diagnostics/blender-smoke/
          if-no-files-found: ignore
      - name: Commit only verified toolchain diagnostics
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add fengming-v2-scene-a/diagnostics/blender-smoke/
          if git diff --cached --quiet; then
            echo 'Identical diagnostics already tracked'; exit 0
          fi
          git commit -m 'H21 PASS Blender EGL, editable blend, GLB, four-angle rendering'
          git pull --rebase origin main
          git push origin HEAD:main
