name: Stop superseded slow H26 Blender job only
on:
  push:
    paths: ['.github/workflows/pine005-h26-cancel-slow.yml']
permissions:
  actions: write
  contents: read
jobs:
  stop-obsolete:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded H26 original run 45842650284
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/d7gkdrs4pk-gif/wanxiang-cloud-tour/actions/runs/45842650284/cancel" || true
          echo "No other workflow run or repo asset touched"
