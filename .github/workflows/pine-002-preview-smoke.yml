name: PINE-002 visual preview smoke
on:
  push:
    paths:
      - '.github/workflows/pine-002-preview-smoke.yml'
      - 'fengming-v2-scene-a/pine-002-preview.html'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Browser smoke and four-angle evidence
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/pine-preview-http.log 2>&1 &
          sleep 2
          node - <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({
              headless:true,
              args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage','--no-sandbox']
            });
            const folder='fengming-v2-scene-a/assets/pine-002';
            const consoleErrors=[];
            const page=await browser.newPage({viewport:{width:1040,height:800},deviceScaleFactor:1});
            page.on('pageerror',e=>consoleErrors.push('pageerror '+e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push('console '+m.text());});
            const url='http://127.0.0.1:8877/fengming-v2-scene-a/pine-002-preview.html';
            try{
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:40000});
              if(response.status()!==200)throw Error('Preview HTTP status '+response.status());
              await page.waitForFunction(()=>document.querySelector('#status')?.textContent?.includes('模型已加载'),{timeout:80000});
              await page.locator('button[data-view="front"]').click();
              await page.waitForTimeout(1000);
              await page.screenshot({path:folder+'/proof-front.jpg',type:'jpeg',quality:75});
              await page.locator('button[data-view="right"]').click();
              await page.waitForTimeout(800);
              await page.screenshot({path:folder+'/proof-right.jpg',type:'jpeg',quality:75});
              await page.locator('button[data-view="back"]').click();
              await page.waitForTimeout(800);
              await page.screenshot({path:folder+'/proof-back.jpg',type:'jpeg',quality:75});
              await page.locator('#double').click();
              await page.locator('button[data-view="front"]').click();
              await page.waitForTimeout(800);
              await page.screenshot({path:folder+'/proof-double.jpg',type:'jpeg',quality:75});
              await page.locator('#ref').click();
              if(!await page.locator('#reference').evaluate(e=>e.classList.contains('visible')))throw Error('Reference toggle failed');
              await page.locator('#wire').click();
              if(!await page.locator('#wire').evaluate(e=>e.classList.contains('on')))throw Error('Wireframe toggle failed');
              const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              mobile.on('pageerror',e=>consoleErrors.push('mobile '+e.message));
              await mobile.goto(url,{waitUntil:'domcontentloaded',timeout:40000});
              await mobile.waitForFunction(()=>document.querySelector('#status')?.textContent?.includes('模型已加载'),{timeout:80000});
              await mobile.locator('button[data-view="front"]').click();
              await mobile.waitForTimeout(700);
              await mobile.screenshot({path:folder+'/proof-mobile.jpg',type:'jpeg',quality:70});
              const stats=await page.evaluate(()=>({canvas:!!document.querySelector('canvas'),ready:document.querySelector('#status')?.textContent,buttons:document.querySelectorAll('.toolbar button').length}));
              console.log('Browser 3D loaded:',JSON.stringify(stats));
              console.log('Browser console errors:',JSON.stringify(consoleErrors.slice(-10)));
              if(consoleErrors.length)throw Error('Unexpected browser errors: '+consoleErrors.slice(-3).join('; '));
              fs.writeFileSync(folder+'/preview-smoke.json',JSON.stringify({status:'passed',stats,angles:['front','right','back','double','mobile'],console_errors:consoleErrors.length},null,2));
            }catch(error){
              console.log('Browser failure:',error.message);
              console.log('Console errors:',JSON.stringify(consoleErrors.slice(-12)));
              console.log('HTTP server:',fs.existsSync('/tmp/pine-preview-http.log')?fs.readFileSync('/tmp/pine-preview-http.log','utf-8').slice(-2500):'none');
              await browser.close();
              process.exit(1);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Make compact visual QA contact sheet
        if: success()
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          root=Path('fengming-v2-scene-a/assets/pine-002')
          files=['proof-front.jpg','proof-right.jpg','proof-back.jpg','proof-double.jpg']
          labels=['FRONT','RIGHT','BACK','DOUBLE SIDED']
          width=1040;height=940
          out=Image.new('RGB',(width,height),(27,37,43))
          d=ImageDraw.Draw(out)
          for i,(name,label) in enumerate(zip(files,labels)):
              photo=Image.open(root/name).convert('RGB')
              photo.thumbnail((500,422))
              x=13+(i%2)*515+(500-photo.width)//2
              y=10+(i//2)*465+27
              out.paste(photo,(x,y))
              d.text((20+(i%2)*515,11+(i//2)*465),label,fill=(235,225,205))
          dst=root/'pine-002-contact-sheet.jpg'
          out.save(dst,quality=66,optimize=True)
          print('CONTACT_SHEET_BYTES',dst.stat().st_size)
          print('BEGIN_PINE002_JPEG_BASE64')
          import base64
          print(base64.b64encode(dst.read_bytes()).decode('ascii'))
          print('END_PINE002_JPEG_BASE64')
          PY
      - name: Upload QA evidence without changing the game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pine-002-browser-proof
          path: |
            fengming-v2-scene-a/assets/pine-002/proof-*.jpg
            fengming-v2-scene-a/assets/pine-002/preview-smoke.json
            fengming-v2-scene-a/assets/pine-002/pine-002-contact-sheet.jpg
          if-no-files-found: ignore
