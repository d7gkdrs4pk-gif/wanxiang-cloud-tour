<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinderwatch 同版场景验证</title><style>body{background:#10151d;color:#ddd6c9;font:16px/1.6 system-ui;max-width:1100px;margin:24px auto;padding:0 16px}a{color:#e9ba71}img{width:100%;height:auto;background:#000}figure{margin:24px 0}small{color:#aaa}video{width:100%;background:#000}</style><h1>Cinderwatch · 同版场景 R1</h1><p><a href="../?v=r1-a11fb9c">进入实时可操作场景（手机横屏）</a> · <a href="../QA.md">测试报告</a> · <a href="../THIRD_PARTY_NOTICES.md">原作署名与MIT许可</a></p><p>使用 kevintngo 的 Cinderwatch 历史源码8313bb2；seed4，第5131模拟帧。场景和玩法来自原作，本工程负责独立入口、首屏对齐与触控菜单适配。</p><figure><video controls playsinline preload="metadata" poster="public-first.png" src="cloud-touch-15s.mp4"></video><figcaption>公开链接15秒连续原速触屏记录。云Linux WebKit软件GPU，实测帧率见<a href="public-smoke.json">公网测试数据</a>；视频编码25FPS不能代表实际游戏帧率。</figcaption></figure><figure><img src="official-replica-side-by-side.png"><figcaption>左：原作者官方历史演示；右：本入口实时三维首帧。同机位未对齐变形；不是视频背景。完整指标与压缩/颗粒差异见<a href="official-comparison.json">比对记录</a>。</figcaption></figure><figure><img src="webkit-landscape-first.png"><figcaption>WebKit云端手机横屏模拟，844×390，完整16:9构图。</figcaption></figure><figure><img src="touch-built-tower.png"><figcaption>原生触屏实际出售炮塔后原地建成弓塔；原金币与建造判定。</figcaption></figure><p>云Linux软件GPU：Chromium录屏约0.592FPS；WebKit无录屏约3.586FPS。这不是iPhone或微信真机结果，也不代表硬件流畅度已验证。<a href="touch-playtest.json">触屏记录</a> · <a href="webkit-test.json">WebKit记录</a>。</p><p>保留<a href="../../fengming-v2-scene-a/gate-h36.html">凤鸣H36</a>，本入口独立运行。参考后半段有剪辑，实时战局不会按剪辑秒数跳转。未发布私人云盘录像或帧。</p></html>
