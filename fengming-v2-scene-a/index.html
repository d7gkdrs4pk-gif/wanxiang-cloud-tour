let bridgeTest=null;const testMode=new URLSearchParams(location.search).get('test')==='1';const testPanel=document.createElement('div');testPanel.style.cssText='display:none;position:absolute;left:12px;bottom:55px;background:#14232def;color:#fff;padding:8px;border-radius:8px;z-index:10;max-width:65vw';const picker=document.createElement('select');picker.style.cssText='max-width:100%;font-size:14px';testPanel.append(picker);const testInfo=document.createElement('div');testPanel.append(testInfo);for(const reverse of [false,true]){const btn=document.createElement('button');btn.textContent=reverse?'反向测试':'正向测试';btn.style.cssText='position:static;width:78px;height:34px;border-radius:6px;margin:3px';testPanel.append(btn);btn.onclick=()=>{const q=corridors[Number(picker.value)];if(!q)return;const d=reverse?q.len:0,x=q.ax+q.ux*d,z=q.az+q.uz*d,h=groundAt(x,z);if(h===null){testInfo.textContent='入口无有效地面';return}player.position.set(x,h,z);target.set(q.ax+q.ux*(reverse?0:q.len),h,q.az+q.uz*(reverse?0:q.len));bridgeTest={q,reverse,start:performance.now(),last:player.position.clone(),stuck:0};testInfo.textContent='测试中';}}document.body.append(testPanel);function updateBridgeTest(dt){if(!bridgeTest)return;const t=bridgeTest,q=t.q,ex=q.ax+q.ux*(t.reverse?0:q.len),ez=q.az+q.uz*(t.reverse?0:q.len);if(Math.hypot(player.position.x-ex,player.position.z-ez)<.25){testInfo.textContent='移动模拟通过';bridgeTest=null;return}if(player.position.distanceTo(t.last)<.001)t.stuck+=dt;else t.stuck=0;t.last.copy(player.position);if(t.stuck>1||performance.now()-t.start>30000){testInfo.textContent='移动模拟失败 · '+player.position.x.toFixed(1)+','+player.position.z.toFixed(1);bridgeTest=null;target.copy(player.position)}}function setupTests(){if(!testMode)return;testPanel.style.display='block';picker.innerHTML='';corridors.forEach((q,i)=>{const o=document.createElement('option');o.value=i;o.textContent='桥 '+(i+1)+' · '+(window.navigationAudit?.details[i]?.ok?'数据通过':'数据异常');picker.append(o)})}
