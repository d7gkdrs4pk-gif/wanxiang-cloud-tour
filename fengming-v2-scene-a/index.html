<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>凤鸣山门 V2.0 场景实验</title><style>body{margin:0;background:#101e2b;color:#ead8b4;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}header{position:absolute;top:16px;left:18px;pointer-events:none}h2{margin:0;font-weight:400;letter-spacing:5px}small{opacity:.7}#msg{position:absolute;bottom:20px;left:18px}button{position:absolute;right:20px;bottom:20px;background:#422a21;color:#ffe0a0;border:1px solid #d6a35c;border-radius:50%;width:76px;height:76px}</style><header><h2>栖凤古坛</h2><small>V2.0 · 山门资产测试 D</small></header><div id="msg">触碰地面移动 · 自动攻击</div><button id="fire">凤火</button><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const s=new T.Scene();s.background=new T.Color(0x142738);s.fog=new T.FogExp2(0x142738,.041);
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.6));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.05;document.body.append(r.domElement);
const c=new T.PerspectiveCamera(39,innerWidth/innerHeight,.1,160);c.position.set(13,19,23);c.lookAt(0,0,0);
s.add(new T.HemisphereLight(0x92b8ed,0x3b302c,1.15));const moon=new T.DirectionalLight(0xabcfff,2.8);moon.position.set(-12,20,-8);moon.castShadow=true;Object.assign(moon.shadow.camera,{left:-19,right:19,top:19,bottom:-19});moon.shadow.mapSize.set(2048,2048);s.add(moon);
let seed=71;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function tex(){let a=document.createElement('canvas');a.width=a.height=256;let x=a.getContext('2d');x.fillStyle='#777e80';x.fillRect(0,0,256,256);for(let i=0;i<18000;i++){let v=80+rand()*90|0;x.fillStyle='rgba('+v+','+(v+3)+','+(v+6)+',.25)';x.fillRect(rand()*256,rand()*256,1+rand()*4,1+rand()*3)}return new T.CanvasTexture(a)}
const stone=new T.MeshStandardMaterial({color:0x71818a,map:tex(),roughness:.9}),rock=new T.MeshStandardMaterial({color:0x46535e,roughness:1,flatShading:true}),wood=new T.MeshStandardMaterial({color:0x50342a,roughness:.8}),roof=new T.MeshStandardMaterial({color:0x263b42,roughness:.55}),gold=new T.MeshStandardMaterial({color:0xc28b39,metalness:.7,roughness:.35});
function mesh(g,m,x,y,z,p=s){let o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}
function box(x,y,z,w,h,d,m,p=s){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}
mesh(new T.CylinderGeometry(12,10,4,32),rock,0,-2.1,0);
for(let i=0;i<80;i++){let a=rand()*Math.PI*2,rr=10+rand()*3;let o=mesh(new T.IcosahedronGeometry(1,1),rock,Math.cos(a)*rr,-1-rand()*2,Math.sin(a)*rr);o.scale.set(1+rand()*2,2+rand()*3,1+rand()*2);o.rotation.set(rand(),rand(),rand())}
for(let x=-8;x<=8;x++)for(let z=-8;z<=8;z++){if(x*x+z*z>95)continue;let o=box(x*1.12,.04+rand()*.045,z*1.12,1.08,.19,1.08,stone);o.rotation.y=(rand()-.5)*.025}
const gateStatus=document.createElement('small');gateStatus.style.cssText='display:block;color:#ffd59b;margin-top:5px';gateStatus.textContent='山门模型加载中';document.querySelector('header').append(gateStatus);
new GLTFLoader().load('./assets/gate-001/gate.glb',gltf=>{const model=gltf.scene;model.updateMatrixWorld(true);const b=new T.Box3().setFromObject(model),sz=b.getSize(new T.Vector3()),center=b.getCenter(new T.Vector3());if(!Number.isFinite(sz.x)||sz.x<=0||sz.y<=0){gateStatus.textContent='模型尺寸异常';return}const scale=8.4/Math.max(sz.x,sz.z);model.scale.setScalar(scale);model.position.set(-center.x*scale,.15-b.min.y*scale,-7.8-center.z*scale);let faces=0;model.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;faces+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3}});s.add(model);gateStatus.textContent='真实 GLB 山门 · '+Math.round(faces).toLocaleString()+' 三角面';},undefined,e=>{gateStatus.textContent='山门加载失败，请刷新';console.error(e)});
const lamps=[];for(let x of [-6,6])for(let z of [-5,4]){box(x,.65,z,.6,1.3,.6,stone);box(x,1.4,z,.9,.18,.9,roof);let m=new T.MeshStandardMaterial({color:0xffae48,emissive:0xff781b,emissiveIntensity:3});mesh(new T.SphereGeometry(.23,16,12),m,x,1.75,z);let l=new T.PointLight(0xff8c32,32,8,2);l.position.set(x,1.8,z);s.add(l);lamps.push(l)}

// Environment detailing: layered mountain silhouettes, twisted trees, carved paving and lantern halos.
const bark=new T.MeshStandardMaterial({color:0x34312e,roughness:1});
const moss=new T.MeshStandardMaterial({color:0x384f48,roughness:1});
function limb(a,b,r1,r2,p=s){let v=new T.Vector3().subVectors(b,a);let o=mesh(new T.CylinderGeometry(r2,r1,v.length(),7),bark,0,0,0,p);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());return o}
for(let j=0;j<9;j++){let a=j*6.283/9+.2,rr=9.3;let x=Math.cos(a)*rr,z=Math.sin(a)*rr;if(z< -6&&Math.abs(x)<5)continue;let g=new T.Group();g.position.set(x,.1,z);s.add(g);let h=2+rand()*2;let root=new T.Vector3(),mid=new T.Vector3(.3,h*.5,.1),top=new T.Vector3(-.25,h,.3);limb(root,mid,.23,.14,g);limb(mid,top,.14,.06,g);for(let k=0;k<5;k++){let a=k*2.4;let end=new T.Vector3(Math.cos(a)*(1+rand()),h*(.75+rand()*.35),Math.sin(a)*(1+rand()));limb(mid,end,.075,.022,g);let leaf=mesh(new T.IcosahedronGeometry(.7,1),moss,end.x,end.y,end.z,g);leaf.scale.set(1.4,.45,1.1)}}
for(let i=0;i<28;i++){let a=i*.65,rr=23+rand()*20;let o=mesh(new T.IcosahedronGeometry(1,1),rock,Math.cos(a)*rr,-6,Math.sin(a)*rr);o.scale.set(4+rand()*7,7+rand()*15,4+rand()*5);o.castShadow=false}
const haloCanvas=document.createElement('canvas');haloCanvas.width=haloCanvas.height=128;let hx=haloCanvas.getContext('2d'),hg=hx.createRadialGradient(64,64,0,64,64,64);hg.addColorStop(0,'rgba(255,190,85,.8)');hg.addColorStop(.2,'rgba(255,125,35,.3)');hg.addColorStop(1,'rgba(255,80,0,0)');hx.fillStyle=hg;hx.fillRect(0,0,128,128);let haloTex=new T.CanvasTexture(haloCanvas);for(const l of lamps){let sp=new T.Sprite(new T.SpriteMaterial({map:haloTex,transparent:true,depthWrite:false,blending:T.AdditiveBlending}));sp.position.copy(l.position);sp.scale.set(2.2,2.2,1);s.add(sp)}
for(let i=0;i<3;i++){let ring=mesh(new T.TorusGeometry(2.1+i*.23,.035,6,96),gold,0,.19,0);ring.rotation.x=Math.PI/2}
for(let i=0;i<12;i++){let a=i*Math.PI/6;let o=box(Math.sin(a)*2.8,.18,Math.cos(a)*2.8,.12,.045,.65,gold);o.rotation.y=a}
const player=new T.Group();s.add(player);const red=new T.MeshStandardMaterial({color:0x8e2920,roughness:.6});mesh(new T.CylinderGeometry(.25,.48,.85,12),red,0,.65,0,player);mesh(new T.SphereGeometry(.22,20,16),gold,0,1.25,0,player);box(.45,.8,0,.13,.13,1.25,gold,player);
const target=new T.Vector3(),ray=new T.Raycaster(),plane=new T.Plane(new T.Vector3(0,1,0),0);r.domElement.addEventListener('pointerdown',e=>{ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),c);ray.ray.intersectPlane(plane,target);if(target.length()>8)target.setLength(8)});
const sparks=[];document.querySelector('#fire').onclick=()=>{for(let i=0;i<70;i++){let o=mesh(new T.SphereGeometry(.07,6,6),new T.MeshBasicMaterial({color:i%2?0xffa323:0xffe9a0}),player.position.x,.8,player.position.z);sparks.push({o,v:new T.Vector3((rand()-.5)*9,rand()*5,(rand()-.5)*9),life:1})}};
const enemies=[];let hp=100,kills=0,spawn=0,attack=0;const enemyMat=new T.MeshStandardMaterial({color:0x463b52,roughness:.7});function enemy(){let g=new T.Group();s.add(g);let a=rand()*6.283;g.position.set(Math.cos(a)*8,.15,Math.sin(a)*8);let b=mesh(new T.IcosahedronGeometry(.55,1),enemyMat,0,.55,0,g);b.scale.set(1,1.4,1);for(let k of [-1,1]){let horn=mesh(new T.ConeGeometry(.13,.65,8),gold,k*.35,1.15,0,g);horn.rotation.z=-k*.45}enemies.push({g,hp:3})}function combat(dt){if(hp<=0)return;spawn-=dt;attack-=dt;if(spawn<=0&&enemies.length<10){enemy();spawn=2.2}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],d=player.position.clone().sub(e.g.position);d.y=0;let len=d.length();if(len>1)e.g.position.addScaledVector(d.normalize(),dt*1.2);else hp=Math.max(0,hp-dt*8);if(len<2.6&&attack<=0){e.hp--;attack=.45;let o=mesh(new T.TorusGeometry(1.3,.055,8,48),new T.MeshBasicMaterial({color:0xffbd55}),player.position.x,.6,player.position.z);o.rotation.x=Math.PI/2;sparks.push({o,v:new T.Vector3(),life:.3})}if(e.hp<=0){s.remove(e.g);enemies.splice(i,1);kills++}}document.querySelector('#msg').textContent=hp>0?'生命 '+Math.ceil(hp)+' · 击败 '+kills:'战斗结束 · 点击重试';}document.querySelector('#msg').onclick=()=>{if(hp<=0)location.reload()};const oldFire=document.querySelector('#fire').onclick;let cd=0;document.querySelector('#fire').onclick=()=>{if(cd>0||hp<=0)return;cd=8;oldFire();for(const e of enemies)if(e.g.position.distanceTo(player.position)<5)e.hp=0};let last=performance.now();function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;let d=target.clone().sub(player.position);if(d.length()>.1){player.rotation.y=Math.atan2(d.x,d.z);player.position.addScaledVector(d.normalize(),dt*3)}lamps.forEach((l,i)=>l.intensity=30+Math.sin(t*.008+i)*4);for(let i=sparks.length-1;i>=0;i--){let a=sparks[i];a.life-=dt;a.o.position.addScaledVector(a.v,dt);a.o.scale.setScalar(Math.max(.01,a.life));if(a.life<=0){s.remove(a.o);a.o.geometry.dispose();a.o.material.dispose();sparks.splice(i,1)}}cd=Math.max(0,cd-dt);document.querySelector('#fire').textContent=cd>0?Math.ceil(cd)+'秒':'凤火';combat(dt);r.render(s,c);requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></html>
